name: DevFlow CD

on:
  workflow_run:
    workflows:
      - DevFlow CI

    types:
      - completed

    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.service }} Image

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: api
            context: ./api
            image: devflow-api

          - service: dashboard
            context: ./dashboard
            image: devflow-dashboard

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate short commit SHA
        id: version
        shell: bash
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "short_sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and publish ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true

          tags: |
            ghcr.io/domgaga79/${{ matrix.image }}:latest
            ghcr.io/domgaga79/${{ matrix.image }}:sha-${{ steps.version.outputs.short_sha }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}